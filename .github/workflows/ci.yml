name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code@2.1.301
      - run: claude plugin validate --strict ./plugin
      - run: claude plugin validate --strict .
      - run: python3 scripts/check-hook-shells.py plugin

  windows:
    # Real Windows, no model access: install from this checkout, then run the installed plugin's
    # hook commands through Git Bash, Windows PowerShell, and PowerShell 7.
    runs-on: windows-latest
    steps:
      - name: Use a throwaway Claude Code configuration
        shell: bash
        run: echo "CLAUDE_CONFIG_DIR=$(cygpath -m "$RUNNER_TEMP")/claude-config" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code@2.1.301
      - run: claude --version
      - run: claude plugin validate --strict ./plugin
      - name: Install from this checkout
        shell: bash
        run: claude plugin install keel --marketplace "$GITHUB_WORKSPACE" -y
      - name: Installed hook commands run in each Windows shell
        shell: bash
        run: |
          root="$(find "$CLAUDE_CONFIG_DIR/plugins/cache" -path '*keel*' -name plugin.json -path '*.claude-plugin*' | head -n 1 | xargs dirname | xargs dirname)"
          echo "installed plugin root: $root"
          python scripts/check-hook-shells.py "$root"
      - name: Headless session without credentials (informational)
        shell: bash
        continue-on-error: true
        run: |
          cd "$RUNNER_TEMP"
          claude -p "Reply with exactly: OK" --output-format stream-json --verbose < /dev/null > events.jsonl 2> stderr.txt || true
          python - <<'PY'
          import json, os
          path = os.path.join(os.environ["RUNNER_TEMP"], "events.jsonl")
          for line in open(path, encoding="utf-8", errors="replace"):
              try:
                  d = json.loads(line)
              except ValueError:
                  continue
              if d.get("subtype") == "hook_response" and d.get("hook_event") == "SessionStart":
                  print("SessionStart hook", d.get("outcome"), "exit", d.get("exit_code"), repr((d.get("stdout") or "")[:40]))
              if d.get("type") == "result":
                  print("result: is_error", d.get("is_error"), str(d.get("result"))[:120])
          PY
          head -c 600 stderr.txt
      - name: Uninstall
        shell: bash
        run: |
          claude plugin uninstall keel@keel
          ! grep -q '"keel@keel"' "$CLAUDE_CONFIG_DIR/plugins/installed_plugins.json"
